[tool.poetry]
name = "loading"
version = "1.0.0"
description = "Matrix data analysis programs loaded with Poetry"
authors = ["Neo <neo@zion.matrix>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
pandas = ">=2.0"
numpy = ">=1.24"
matplotlib = ">=3.7"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
